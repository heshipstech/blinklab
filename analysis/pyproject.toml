[project]
name = "blinklab-analysis"
version = "0.1.0"
description = "The honest evaluation track: statistics over sessions the browser recorded."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Deliberately NOT in dev, so continuous integration never installs it.
# Preparing a benchmark corpus is a one-off local step, and CI has no
# corpus to prepare. Install with: uv sync --group corpus
corpus = [
    "imageio-ffmpeg>=0.5",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
# Errors, warnings, isort, bugbear, comprehensions, pyupgrade, and the
# pandas gotchas. The house rule from 0.3 carried into Python: the
# linter is a contract, not a suggestion.
select = ["E", "W", "F", "I", "B", "C4", "UP", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package sits beside the tests rather than under src/, so the
# runner is told where to look. A bare interpreter adds the working
# directory for you; pytest deliberately does not.
pythonpath = ["."]
