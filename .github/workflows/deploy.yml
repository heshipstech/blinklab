name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top, with the two Pages grants scoped to the job that
# actually needs them (below). Until 2026-08-14 `pages: write` and
# `id-token: write` sat here, so the build job held them too — and build only
# checks out, runs npm ci/build and uploads an artifact. `id-token: write` is
# the one that matters: it lets a job mint an OIDC token, the credential other
# systems trust for keyless auth, and build is the job that executes
# third-party dependency code.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      # --ignore-scripts, roadmap 10.1c and ladder D16: a dependency's
      # own install hook runs arbitrary code from the npm tree, and this
      # workflow has a token. Only fsevents ships one today, and it is a
      # no-op off macOS. The project's own prebuild step is unaffected,
      # because --ignore-scripts is per invocation: `npm run build` still
      # runs `prepare-assets` and the MediaPipe wasm files still populate.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that publishes, and the only one that needs these.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
