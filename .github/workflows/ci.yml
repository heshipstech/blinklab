name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check
      # The end to end test drives the real built app in a headless
      # browser with a fake camera stream. Chromium only, kept last:
      # it is the slowest check and the cheap ones should fail first.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
