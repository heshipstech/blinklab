name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: this repository is public, so a secret committed and
      # later reverted is still exposed. Scanning only HEAD would miss exactly
      # the case that matters.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # MIT-licensed gitleaks binary rather than gitleaks-action, which is
      # NOASSERTION-licensed and gates some accounts behind a licence key.
      #
      # The checksum is verified before the archive is opened. Pinning the
      # version is not pinning the file: a release *asset* is a separately
      # uploaded blob and can be replaced without the tag moving. This is the
      # job whose whole purpose is supply-chain hygiene, and it runs against a
      # full checkout on every PR. Checksum from
      # gitleaks_8.30.1_checksums.txt; move both together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact so a finding never prints the secret into a public run log.
      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  checks:
    runs-on: ubuntu-latest
    # Installs Playwright and drives a headless browser: the job most likely to
    # hang rather than fail. Without this it inherits GitHub's 360-minute
    # default. Added 2026-08-14.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the stamp guard compares each summary
          # document's dated stamp against the last commit that touched
          # it, which a depth-1 checkout cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      # --ignore-scripts, roadmap 10.1c and ladder D16: a dependency's
      # own install hook runs arbitrary code from the npm tree, and this
      # workflow has a token. Only fsevents ships one today, and it is a
      # no-op off macOS. The project's own prebuild step is unaffected,
      # because --ignore-scripts is per invocation: `npm run build` still
      # runs `prepare-assets` and the MediaPipe wasm files still populate.
      - run: npm ci --ignore-scripts
      # Remediation F1, the Definition of Done as a mechanism rather
      # than an intention. It held for 130 pull requests on intent
      # alone, lapsed at #134, and nobody noticed for weeks. Pull
      # requests only: on a push to main the range would be empty.
      # base.sha is reachable because this checkout has full history.
      - name: Definition of Done
        if: github.event_name == 'pull_request'
        run: node tools/checkLearningEntry.mjs ${{ github.event.pull_request.base.sha }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Roadmap 10.1c, ladder D2. The refusal constants are the ones a
      # silent drift would turn into a published number nobody checked,
      # and until now nothing ran this: it bent a constant removed in
      # August, so it exited "STALE LIST" before checking anything, and
      # it ran the whole suite per mutation, about ninety seconds each.
      # Each entry now runs only the test file that owns its constant,
      # so 27 mutations take about two minutes, most of which is the
      # one full-suite preflight that proves the tree was green before
      # anything was bent.
      - run: node tools/mutationCheck.mjs
      # Roadmap 8.6. The floor is on src/core only, the pure layer
      # where an untested branch becomes a published number nobody
      # checked. Separate from `npm test` so a coverage failure reads
      # as a coverage failure rather than as a broken suite.
      - run: npm run coverage
      - run: npm run build
      # Roadmap 8.7. Must follow the build: it measures dist/.
      - run: npm run bundle:budget
      - run: npm run format:check
      # The end to end test drives the real built app in a headless
      # browser with a fake camera stream. Chromium only, kept last:
      # it is the slowest check and the cheap ones should fail first.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # The Python track of Phase 7, a SEPARATE job on purpose. The two
  # languages have nothing to say to each other at build time, so
  # they fail independently and a broken notebook never blocks a
  # browser fix. uv installs the pinned interpreter as well as the
  # pinned packages, so this job and a laptop run the same versions.
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
